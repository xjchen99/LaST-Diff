# CAMUS training settings. Inference loads the selected release weights by filename.
data:
  root: data/camus
  size: 256
  frames: 16
  views:
  - 2CH
  - 4CH
output_dir: outputs/camus
seed: 37
num_workers: 2
vae:
  model:
    in_channels: 1
    out_channels: 4
    latent_channels: 2
    down_block_types:
    - DownEncoderBlock2D
    - DownEncoderBlock2D
    - DownEncoderBlock2D
    up_block_types:
    - UpDecoderBlock2D
    - UpDecoderBlock2D
    - UpDecoderBlock2D
    block_out_channels:
    - 64
    - 128
    - 256
    norm_num_groups: 32
  training:
    batch_size: 64
    ema_decay: 0.99
    lr: 0.0002
    num_epochs: 5
    beta: 1.0e-6
    save_interval: 1
image_encoder:
  model:
    in_channels: 1
    out_channels: 2
    down_block_types:
    - DownEncoderBlock2D
    - DownEncoderBlock2D
    - DownEncoderBlock2D
    block_out_channels:
    - 128
    - 256
    - 512
    norm_num_groups: 32
  lr: 0.0002
diffusion:
  model:
    in_channels: 4
    out_channels: 2
    down_block_types:
    - DownBlockSpatioTemporal
    - DownBlockSpatioTemporal
    - DownBlockSpatioTemporal
    - DownBlockSpatioTemporal
    up_block_types:
    - UpBlockSpatioTemporal
    - UpBlockSpatioTemporal
    - UpBlockSpatioTemporal
    - UpBlockSpatioTemporal
    block_out_channels:
    - 128
    - 256
    - 512
    - 512
    num_attention_heads:
    - 4
    - 8
    - 16
    - 16
    layers_per_block: 2
    projection_class_embeddings_input_dim: 256
  scheduler:
    num_train_timesteps: 1000
    beta_end: 0.02
    beta_start: 0.0001
    beta_schedule: linear
    clip_sample: false
    prediction_type: epsilon
  idm:
    batch_size: 4
    ema_decay: 0.999
    lr: 0.0002
    num_epochs: 125
    save_interval: 5
  vdm:
    batch_size: 2
    ema_decay: 0.999
    lr: 0.0002
    num_epochs: 500
    save_interval: 1
inference:
  steps: 20
  batch_size: 1
  decode_batch_size: 16
